<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flevora Admin</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F9FAFB; color: #111827; margin: 0; padding: 16px; }
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 12px; text-align: center; }
    .num { font-size: 22px; font-weight: 800; color: #8B5CF6; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #F3F4F6; gap: 8px; flex-wrap: wrap; }
    input { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { background: #8B5CF6; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .red { background: #EF4444; } .gray { background: #6B7280; } .green { background: #10B981; } .blue { background: #3B82F6; }
  </style>
</head>
<body>
  <div id="loginBox" class="card" style="max-width:360px;margin:60px auto;">
    <h2 style="color:#8B5CF6;margin-top:0;">Flevora Admin</h2>
    <input id="em" type="email" placeholder="Admin Email" />
    <input id="pw" type="password" placeholder="Password" />
    <button onclick="login()" style="width:100%;">Sign In</button>
    <p id="err" style="color:#EF4444;font-size:13px;"></p>
  </div>

  <div id="dash" style="display:none;max-width:960px;margin:auto;">
    <div class="top">
      <h2 style="color:#8B5CF6;margin:0;">Flevora Admin Panel</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="green" onclick="downloadBackup()">Backup JSON</button>
        <button onclick="cleanStories()">Clean Expired Stories</button>
        <button class="gray" onclick="logout()">Log Out</button>
      </div>
    </div>
    <div class="grid" id="stats"></div>
    <div class="card"><h3>Account Appeals</h3><div id="appeals">Loading...</div></div>
    <div class="card"><h3>Reported Content</h3><div id="reports">Loading...</div></div>
    <div class="card">
      <h3>User Management</h3>
      <input id="uSearch" placeholder="Search users by @username..." oninput="renderUsers()" />
      <div id="users">Loading...</div>
    </div>
    <div class="card"><h3>All Posts & Reels</h3><div id="posts">Loading...</div></div>
    <div class="card"><h3>Audit Logs</h3><div id="logs">Loading...</div></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyBV63crlJvOorayDbWoeP4bbtDF0VNxGHE",
      authDomain: "flevora-fb8bb.firebaseapp.com",
      projectId: "flevora-fb8bb",
      storageBucket: "flevora-fb8bb.firebasestorage.app",
      messagingSenderId: "506028452820",
      appId: "1:506028452820:web:9e55311c930213f71d0441"
    });
    const auth = getAuth(app), db = getFirestore(app);
    let allUsers = [], allPosts = [], allStories = [], backupCache = {};

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    window.login = async () => { try { await signInWithEmailAndPassword(auth, em.value.trim(), pw.value); } catch (e) { err.innerText = e.message; } };
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (u) => {
      if (!u) { loginBox.style.display = 'block'; dash.style.display = 'none'; return; }
      const token = await u.getIdTokenResult(true);
      if (token.claims?.admin !== true) {
        err.innerText = 'Admin Custom Claim (admin: true) required.';
        await signOut(auth); return;
      }
      loginBox.style.display = 'none'; dash.style.display = 'block';
      loadAll();
    });

    async function loadAll() {
      const [us, ps, ss, rs, aps, ls] = await Promise.all([
        getDocs(collection(db, 'users')), getDocs(collection(db, 'posts')),
        getDocs(collection(db, 'stories')), getDocs(collection(db, 'reports')),
        getDocs(collection(db, 'appeals')), getDocs(collection(db, 'audit_logs')).catch(() => ({ docs: [] }))
      ]);
      allUsers = us.docs.map(d => ({ id: d.id, ...d.data() }));
      allPosts = ps.docs.map(d => ({ id: d.id, ...d.data() }));
      allStories = ss.docs.map(d => ({ id: d.id, ...d.data() }));
      const reps = rs.docs.map(d => ({ id: d.id, ...d.data() }));
      const apps = aps.docs.map(d => ({ id: d.id, ...d.data() }));
      const logs = ls.docs.map(d => ({ id: d.id, ...d.data() }));

      backupCache = {
        users: allUsers.map(({ id, username, status, isVerified }) => ({ id, username, status, isVerified })),
        postsCount: allPosts.length, reportsCount: reps.length, exportedAt: new Date().toISOString()
      };
      stats.innerHTML = [
        ['Users', allUsers.length], ['Posts', allPosts.length], ['Stories', allStories.length], ['Reports', reps.length]
      ].map(([k, v]) => `<div class="stat"><div class="num">${v}</div><div>${k}</div></div>`).join('');

      appeals.innerHTML = apps.map(a => `<div class="row"><div><b>${esc(a.uid)}</b>: ${esc(a.reason || a.message)} (${esc(a.status)})</div><div><button class="green" onclick="reviewAppeal('${a.id}','${a.uid}','approved')">Approve</button> <button class="red" onclick="reviewAppeal('${a.id}','${a.uid}','rejected')">Reject</button></div></div>`).join('') || 'None';
      reports.innerHTML = reps.map(r => `<div class="row"><div><b>${esc(r.type)}</b> (${esc(r.status)})</div><div><button class="green" onclick="setReport('${r.id}','resolved')">Resolve</button> <button class="red" onclick="setReport('${r.id}','dismissed')">Dismiss</button></div></div>`).join('') || 'None';
      posts.innerHTML = allPosts.slice(0, 30).map(p => `<div class="row"><div>@${esc(p.username)} — ${esc(p.caption)}</div><button class="red" onclick="delPost('${p.id}')">Delete</button></div>`).join('') || 'None';
      logs.innerHTML = logs.slice(0, 30).map(l => `<div class="row"><div>${esc(l.action)} (${esc(l.targetId)})</div></div>`).join('') || 'No logs';
      renderUsers();
    }

    window.renderUsers = () => {
      const q = (uSearch.value || '').toLowerCase();
      users.innerHTML = allUsers.filter(u => (u.username || '').toLowerCase().includes(q)).slice(0, 40).map(u => `
        <div class="row">
          <div><b>@${esc(u.username)}</b> (${esc(u.status || 'active')}) ${u.isVerified ? '✓' : ''}</div>
          <div>
            <button class="blue" onclick="toggleVerify('${u.id}',${!u.isVerified})">${u.isVerified ? 'Unverify' : 'Verify'}</button>
            <button class="red" onclick="toggleSuspend('${u.id}','${u.status === 'suspended' ? 'active' : 'suspended'}')">${u.status === 'suspended' ? 'Activate' : 'Suspend'}</button>
          </div>
        </div>`).join('') || 'None';
    };

    window.toggleVerify = async (id, v) => { await updateDoc(doc(db, 'users', id), { isVerified: v }); loadAll(); };
    window.toggleSuspend = async (id, st) => { await updateDoc(doc(db, 'users', id), { status: st }); loadAll(); };
    window.reviewAppeal = async (id, uid, st) => { await updateDoc(doc(db, 'appeals', id), { status: st }); if (st === 'approved') await updateDoc(doc(db, 'users', uid), { status: 'active' }); loadAll(); };
    window.setReport = async (id, st) => { await updateDoc(doc(db, 'reports', id), { status: st }); loadAll(); };
    window.delPost = async (id) => { await deleteDoc(doc(db, 'posts', id)); loadAll(); };
    window.cleanStories = async () => { const now = Date.now(); for (const s of allStories) if (s.expiresAt && s.expiresAt <= now) await deleteDoc(doc(db, 'stories', s.id)); loadAll(); };
    window.downloadBackup = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(backupCache, null, 2)], { type: 'application/json' })); a.download = 'flevora_backup.json'; a.click(); };
  </script>
</body>
</html>
