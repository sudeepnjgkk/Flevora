<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Flevora Admin</title>
        <style>
            body { font-family: system-ui, sans-serif; background: #F9FAFB; color: #111827; margin: 0; padding: 16px; }
                .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
                    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
                        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
                            .stat { background: #fff; border: 1px solid #E5E7EB; border-radius: 12px; padding: 12px; text-align: center; }
                                .num { font-size: 22px; font-weight: 800; color: #8B5CF6; }
                                    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #F3F4F6; gap: 8px; flex-wrap: wrap; }
                                        input { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
                                            button { background: #8B5CF6; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
                                                .red { background: #EF4444; } .gray { background: #6B7280; } .green { background: #10B981; } .blue { background: #3B82F6; }
                                                  </style>
                                                  </head>
                                                  <body>
                                                    <div id="loginBox" class="card" style="max-width:360px;margin:60px auto;">
                                                        <h2 style="color:#8B5CF6;margin-top:0;">Flevora Admin</h2>
                                                            <input id="em" type="email" placeholder="Admin Email" />
                                                                <input id="pw" type="password" placeholder="Password" />
                                                                    <button onclick="login()" style="width:100%;">Sign In</button>
                                                                        <p id="err" style="color:#EF4444;font-size:13px;"></p>
                                                                          </div>

                                                                            <div id="dash" style="display:none;max-width:960px;margin:auto;">
                                                                                <div class="top">
                                                                                      <h2 style="color:#8B5CF6;margin:0;">Flevora Admin Panel</h2>
                                                                                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                                                                                    <button class="green" onclick="downloadBackup()">Backup JSON</button>
                                                                                                            <button onclick="cleanStories()">Clean Expired Stories</button>
                                                                                                                    <button class="gray" onclick="logout()">Log Out</button>
                                                                                                                          </div>
                                                                                                                              </div>
                                                                                                                                  <div class="grid" id="stats"></div>
                                                                                                                                      <div class="card"><h3>Account Appeals</h3><div id="appeals">Loading...</div></div>
                                                                                                                                          <div class="card"><h3>Reported Content</h3><div id="reports">Loading...</div></div>
                                                                                                                                              <div class="card">
                                                                                                                                                    <h3>User Management</h3>
                                                                                                                                                          <input id="uSearch" placeholder="Search users by @username or email..." oninput="renderUsers()" />
                                                                                                                                                                <div id="users">Loading...</div>
                                                                                                                                                                    </div>
                                                                                                                                                                        <div class="card"><h3>All Posts & Reels</h3><div id="posts">Loading...</div></div>
                                                                                                                                                                            <div class="card"><h3>Audit Logs (Immutable)</h3><div id="logs">Loading...</div></div>
                                                                                                                                                                              </div>

                                                                                                                                                                                <script type="module">
                                                                                                                                                                                    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
                                                                                                                                                                                        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
                                                                                                                                                                                            import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

                                                                                                                                                                                                const app = initializeApp({
                                                                                                                                                                                                      apiKey: "AIzaSyBV63crlJvOorayDbWoeP4bbtDF0VNxGHE",
                                                                                                                                                                                                            authDomain: "flevora-fb8bb.firebaseapp.com",
                                                                                                                                                                                                                  projectId: "flevora-fb8bb",
                                                                                                                                                                                                                        storageBucket: "flevora-fb8bb.firebasestorage.app",
                                                                                                                                                                                                                              messagingSenderId: "506028452820",
                                                                                                                                                                                                                                    appId: "1:506028452820:web:9e55311c930213f71d0441"
                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                            const auth = getAuth(app), db = getFirestore(app);
                                                                                                                                                                                                                                                let allUsers = [], allStories = [], backupCache = {}, myRole = 'admin', myUid = '';

                                                                                                                                                                                                                                                    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                                                                                                                                                                                                                                                        const safeId = (v) => String(v ?? '').replace(/[^a-zA-Z0-9_-]/g, '');

                                                                                                                                                                                                                                                            window.login = async () => {
                                                                                                                                                                                                                                                                  try { await signInWithEmailAndPassword(auth, em.value.trim(), pw.value); }
                                                                                                                                                                                                                                                                        catch (e) { err.innerText = e.message; }
                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                window.logout = () => signOut(auth);
                                                                                                                                                                                                                                                                                    const logAction = (action, targetId) => addDoc(collection(db, 'audit_logs'), { adminUid: myUid, action, targetId, createdAt: serverTimestamp() });

                                                                                                                                                                                                                                                                                        onAuthStateChanged(auth, async (u) => {
                                                                                                                                                                                                                                                                                              if (!u) { loginBox.style.display = 'block'; dash.style.display = 'none'; return; }
                                                                                                                                                                                                                                                                                                    const snap = await getDoc(doc(db, 'users', u.uid));
                                                                                                                                                                                                                                                                                                          const role = snap.data()?.role || '';
                                                                                                                                                                                                                                                                                                                if (!['admin', 'super_admin', 'moderator'].includes(role)) {
                                                                                                                                                                                                                                                                                                                        err.innerText = 'Admin access required.'; await signOut(auth); return;
                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                    myRole = role; myUid = u.uid;
                                                                                                                                                                                                                                                                                                                                          loginBox.style.display = 'none'; dash.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                loadAll();
                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                        async function loadAll() {
                                                                                                                                                                                                                                                                                                                                                              const [us, ps, ss, rs, aps, ls] = await Promise.all([
                                                                                                                                                                                                                                                                                                                                                                      getDocs(collection(db, 'users')), getDocs(collection(db, 'posts')),
                                                                                                                                                                                                                                                                                                                                                                              getDocs(collection(db, 'stories')), getDocs(collection(db, 'reports')),
                                                                                                                                                                                                                                                                                                                                                                                      getDocs(collection(db, 'appeals')), getDocs(collection(db, 'audit_logs'))
                                                                                                                                                                                                                                                                                                                                                                                            ]);
                                                                                                                                                                                                                                                                                                                                                                                                  allUsers = us.docs.map(d => ({ id: d.id, ...d.data() }));
                                                                                                                                                                                                                                                                                                                                                                                                        allStories = ss.docs.map(d => ({ id: d.id, ...d.data() }));
                                                                                                                                                                                                                                                                                                                                                                                                              const pList = ps.docs.map(d => ({ id: d.id, ...d.data() }));
                                                                                                                                                                                                                                                                                                                                                                                                                    const rList = rs.docs.map(d => ({ id: d.id, ...d.data() }));
                                                                                                                                                                                                                                                                                                                                                                                                                          const aList = aps.docs.map(d => ({ id: d.id, ...d.data() }));
                                                                                                                                                                                                                                                                                                                                                                                                                                backupCache = { exportedAt: new Date().toISOString(), users: allUsers, posts: pList, stories: allStories, reports: rList, appeals: aList };

                                                                                                                                                                                                                                                                                                                                                                                                                                      stats.innerHTML = [
                                                                                                                                                                                                                                                                                                                                                                                                                                              ['Total Users', allUsers.length], ['Active', allUsers.filter(u => u.status !== 'suspended').length],
                                                                                                                                                                                                                                                                                                                                                                                                                                                      ['Posts', pList.length], ['Reels', pList.filter(p => p.mediaType === 'video').length],
                                                                                                                                                                                                                                                                                                                                                                                                                                                              ['Stories', allStories.length], ['Reports', rList.length]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ].map(([k, v]) => `<div class="stat"><div class="num">${esc(v)}</div><div>${esc(k)}</div></div>`).join('');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          appeals.innerHTML = aList.length ? aList.map(a => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>[${esc(a.status || 'pending')}] ${esc(a.email || a.uid)} — ${esc(a.message)}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button class="green" onclick="reviewAppeal('${safeId(a.id)}','${safeId(a.uid)}','approved')">Approve</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="gray" onclick="reviewAppeal('${safeId(a.id)}','${safeId(a.uid)}','rejected')">Reject</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>`).join('') : 'No appeals.';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      reports.innerHTML = rList.length ? rList.map(r => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span>[${esc(r.status || 'pending')}] ${esc(r.type || 'post')} (${esc(r.postId || r.targetUid || r.id)})</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="green" onclick="setReport('${safeId(r.id)}','resolved')">Resolve</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="gray" onclick="setReport('${safeId(r.id)}','rejected')">Reject</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>`).join('') : 'No reports.';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  renderUsers();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        posts.innerHTML = pList.map(p => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <span>@${esc(p.username)} [${esc(p.mediaType)}] — ${esc(p.caption || 'No caption')}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="red" onclick="delPost('${safeId(p.id)}')">Delete</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>`).join('');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  logs.innerHTML = ls.docs.slice(0, 15).map(d => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const l = d.data();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return `<div class="row"><span>${esc(l.action)} → ${esc(l.targetId)}</span><span style="color:#6B7280;font-size:12px;">by ${esc(l.adminUid?.slice(0,8))}</span></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }).join('') || 'No audit logs yet.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.renderUsers = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const q = (uSearch.value || '').toLowerCase();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            users.innerHTML = allUsers.filter(u => (u.username || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q)).map(u => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const susp = u.status === 'suspended';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const isAdm = myRole === 'admin' || myRole === 'super_admin';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return `<div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span>@${esc(u.username)} ${u.verified ? '☑️' : ''} (${esc(u.email)}) • <b>${esc(u.role || 'user')}</b> • ${esc(u.status || 'active')}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="${susp ? 'green' : 'red'}" onclick="toggleUser('${safeId(u.id)}','${susp ? 'active' : 'suspended'}')">${susp ? 'Activate' : 'Suspend'}</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${isAdm ? `<button class="${u.verified ? 'gray' : 'blue'}" onclick="toggleVerify('${safeId(u.id)}',${!u.verified})">${u.verified ? 'Unverify' : 'Verify'}</button>` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${myRole === 'super_admin' ? `<button class="gray" onclick="makeMod('${safeId(u.id)}')">Set Mod</button>` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.cleanStories = async () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const expired = allStories.filter(s => s.expiresAt && s.expiresAt <= Date.now());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!expired.length) return alert('No expired stories found.');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              await Promise.all(expired.map(s => deleteDoc(doc(db, 'stories', s.id))));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await logAction('clean_expired_stories', String(expired.length));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          alert(`Deleted ${expired.length} expired stories.`); loadAll();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  window.downloadBackup = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const blob = new Blob([JSON.stringify(backupCache, null, 2)], { type: 'application/json' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    a.download = `flevora-backup-${Date.now()}.json`; a.click();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.toggleUser = async (id, status) => { if (!confirm(`Set user ${status}?`)) return; await updateDoc(doc(db, 'users', id), { status }); await logAction(`user_${status}`, id); loadAll(); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.toggleVerify = async (id, verified) => { await updateDoc(doc(db, 'users', id), { verified }); await logAction(verified ? 'verify_user' : 'unverify_user', id); loadAll(); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.makeMod = async (id) => { if (!confirm('Make moderator?')) return; await updateDoc(doc(db, 'users', id), { role: 'moderator' }); await logAction('set_moderator', id); loadAll(); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.setReport = async (id, status) => { await updateDoc(doc(db, 'reports', id), { status, moderatorId: myUid }); await logAction(`report_${status}`, id); loadAll(); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.reviewAppeal = async (aid, uid, status) => { await updateDoc(doc(db, 'appeals', aid), { status, moderatorId: myUid }); if (status === 'approved') await updateDoc(doc(db, 'users', uid), { status: 'active' }); await logAction(`appeal_${status}`, uid); loadAll(); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.delPost = async (id) => { if (!confirm('Delete post permanently?')) return; await deleteDoc(doc(db, 'posts', id)); await logAction('delete_post', id); loadAll(); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
