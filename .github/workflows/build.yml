name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flevora-app

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: flevora-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK if Unsigned
        working-directory: flevora-app/android
        run: |
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
            "$BUILD_TOOLS/apksigner" sign \
              --ks app/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$APK_DIR/flevora-release.apk" \
              "$APK_DIR/app-release-unsigned.apk"
          elif [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$APK_DIR/flevora-release.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flevora-apk
          path: flevora-app/android/app/build/outputs/apk/release/flevora-release.apk
