name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Android APK
        working-directory: flevora-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm install && npx eas-cli build -p android --profile preview --non-interactive
